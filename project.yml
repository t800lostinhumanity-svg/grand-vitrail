name: GrandVitrail
options:
  bundleIdPrefix: fr.grandvitrail
  deploymentTarget:
    iOS: "15.0"
targets:
  GrandVitrail:
    type: application
    platform: iOS
    sources:
      - path: GrandVitrail
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.grandvitrail.jeu
        INFOPLIST_FILE: GrandVitrail/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
